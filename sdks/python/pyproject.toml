[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-flow-sdk"
version = "0.1.0"
description = "Python SDK for ApexFlow Lightweight Workflow Orchestration Engine"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["workflow", "orchestration", "durable-execution", "ai-agents", "apex-flow"]
authors = [
    { name = "ApexFlow Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/jarifulovi/apex-flow"
Documentation = "https://github.com/jarifulovi/apex-flow#readme"
Repository = "https://github.com/jarifulovi/apex-flow"
"Bug Tracker" = "https://github.com/jarifulovi/apex-flow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_flow_sdk*"]
